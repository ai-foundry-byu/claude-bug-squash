[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-bug-squash"
version = "0.1.0"
description = "Autonomous, gated bug-squashing for any repo — triage, fix, prove, review-panel, and merge behind layered safety rails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JD Davenport" }]
keywords = ["claude", "claude-code", "bugfix", "agent", "automation", "ci", "code-review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Bug Tracking",
]
# Zero runtime dependencies — stdlib only (sqlite3, tomllib, urllib). The fixer +
# review panel shell out to the `claude` CLI, which you install separately.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JDDavenport/claude-bug-squash"
Issues = "https://github.com/JDDavenport/claude-bug-squash/issues"

[project.scripts]
bug-squash = "bugsquash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bugsquash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
